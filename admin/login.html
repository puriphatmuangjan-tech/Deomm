<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIDAY · เข้าสู่ระบบ</title>
<style>
  @font-face { font-family: "PSL"; src: url("/assets/resources/native/0e/0e888ccc-a2f1-4724-b1e1-9d4e8c645d10/psl147.ttf") format("truetype"); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; color:#e9f6ff;
    font:15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;
    background: radial-gradient(1000px 500px at 50% -10%, #1fa3c9 0%, transparent 60%), linear-gradient(160deg,#0d2a5c,#3b1f6e); }
  .card { width:min(380px, 92vw); background:rgba(10,20,50,.75); border:1px solid rgba(140,220,255,.35);
    border-radius:12px; padding:30px 26px 26px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-family:"PSL",system-ui; font-size:52px; letter-spacing:3px; margin:0; text-align:center; line-height:1;
       color:#fff; text-shadow:0 0 12px #6fe7ff, 0 0 2px #fff; }
  .sub { text-align:center; font-family:"PSL",system-ui; font-size:24px; color:#6fe7ff; margin:4px 0 22px; }
  label { display:block; font-size:13px; color:#93b3d6; margin:0 0 4px; }
  input { width:100%; padding:11px 12px; border-radius:6px; border:1px solid rgba(140,220,255,.35);
    background:rgba(0,0,0,.35); color:#e9f6ff; font:inherit; margin-bottom:14px; }
  input:focus { outline:none; border-color:#6fe7ff; box-shadow:0 0 0 2px rgba(111,231,255,.25); }
  button { width:100%; padding:11px; margin-top:6px; font:inherit; font-weight:600; color:#fff; cursor:pointer; border-radius:6px;
    background:linear-gradient(180deg,#3a1a55,#1b0f33); border:1px solid #c88bff; box-shadow:0 0 12px rgba(200,139,255,.35); }
  button:hover { box-shadow:0 0 18px rgba(200,139,255,.6); }
  button:disabled { opacity:.6; cursor:wait; }
  .err { min-height:22px; color:#ff6b8a; font-size:14px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <h1>FRIDAY</h1>
    <div class="sub">ระบบหลังบ้าน</div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">เข้าสู่ระบบ</button>
    <div class="err" id="e"></div>
  </form>
<script>
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/admin/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
    const d = await r.json();
    if (r.ok) return location.href = '/admin';
    e.textContent = d.error || 'เข้าสู่ระบบไม่สำเร็จ';
  } catch { e.textContent = 'ติดต่อ server ไม่ได้'; }
  b.disabled = false;
};
</script>
</body>
</html>
